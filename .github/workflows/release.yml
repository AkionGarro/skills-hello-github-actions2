# =============================================================================
# RELEASE WORKFLOW
# =============================================================================
# Triggered when a version tag (v*) is pushed to the repository.
# Demonstrates:
#   - Tag-based trigger (on: push: tags:)
#   - Building release assets
#   - Creating a GitHub Release using the gh CLI
#   - Uploading release assets as artifacts and attaching them to the release
#   - Using GITHUB_TOKEN with explicit write permissions
#
# HOW TO TRIGGER:
#   git tag v1.2.3
#   git push origin v1.2.3
#
# Or via GitHub UI: Releases → Draft a new release → Create new tag
# =============================================================================

name: Release

on:
  # TAG PUSH TRIGGER: Only runs when a tag matching 'v*' is pushed.
  # Examples: v1.0.0, v2.1.3-beta, v0.9.0-rc1
  push:
    tags:
      - "v*"

  # Allow manual triggering for testing
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag/version to release (e.g. v1.0.0)"
        required: true
        type: string

# =============================================================================
# PERMISSIONS
# 'contents: write' is required to create GitHub Releases and upload assets.
# =============================================================================
permissions:
  contents: write

# =============================================================================
# JOBS
# =============================================================================
jobs:

  # ---------------------------------------------------------------------------
  # JOB 1: build-release
  # Builds the application and packages it as a release asset.
  # ---------------------------------------------------------------------------
  build-release:
    name: "Build Release Asset"
    runs-on: ubuntu-latest

    outputs:
      tag-name: ${{ steps.get-tag.outputs.tag }}
      asset-name: ${{ steps.build.outputs.asset-name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history for changelog generation
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      # Determine the tag name from the event or manual input
      - name: Get tag name
        id: get-tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            # github.ref for a tag push is 'refs/tags/v1.0.0'
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Releasing tag: ${TAG}"

      # Run tests before releasing to ensure quality
      - name: Run tests
        run: npm test

      # Build the application
      - name: Build application
        id: build
        shell: bash
        run: |
          TAG="${{ steps.get-tag.outputs.tag }}"
          ASSET_NAME="app-${TAG}.tar.gz"

          echo "Building release ${TAG}..."
          npm run build

          # Package the build output as a tarball
          tar -czf "${ASSET_NAME}" -C dist .

          echo "asset-name=${ASSET_NAME}" >> $GITHUB_OUTPUT
          echo "Built asset: ${ASSET_NAME}"
          ls -lh "${ASSET_NAME}"

      # Upload the packaged asset as a workflow artifact
      - name: Upload release asset as artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-asset-${{ steps.get-tag.outputs.tag }}
          path: ${{ steps.build.outputs.asset-name }}
          retention-days: 90

  # ---------------------------------------------------------------------------
  # JOB 2: create-release
  # Downloads the build artifact and creates a GitHub Release with it.
  # ---------------------------------------------------------------------------
  create-release:
    name: "Create GitHub Release"
    runs-on: ubuntu-latest
    needs: [build-release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # DOWNLOAD ARTIFACT: Retrieve the build asset from the previous job
      - name: Download release asset
        uses: actions/download-artifact@v4
        with:
          name: release-asset-${{ needs.build-release.outputs.tag-name }}
          path: ./release-assets/

      # Generate a changelog from recent git commits
      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          TAG="${{ needs.build-release.outputs.tag-name }}"
          echo "Generating changelog for ${TAG}..."

          # Get commits since last tag (or all commits if no previous tag)
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -1 || echo "")

          if [ -n "${PREV_TAG}" ]; then
            COMMITS=$(git log --oneline "${PREV_TAG}..HEAD" 2>/dev/null || git log --oneline -20)
          else
            COMMITS=$(git log --oneline -20)
          fi

          CHANGELOG="## What's Changed\n\n${COMMITS}"
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo -e "${CHANGELOG}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # USE gh CLI to create the GitHub Release and upload the asset
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.build-release.outputs.tag-name }}"
          ASSET="${{ needs.build-release.outputs.asset-name }}"
          ASSET_PATH="./release-assets/${ASSET}"

          echo "Creating release for tag: ${TAG}"
          echo "Asset: ${ASSET_PATH}"

          # Determine if this is a pre-release (contains alpha, beta, rc)
          PRERELEASE_FLAG=""
          if echo "${TAG}" | grep -qE "(alpha|beta|rc)"; then
            PRERELEASE_FLAG="--prerelease"
            echo "This is a pre-release"
          fi

          # Create the GitHub Release using gh CLI
          # GITHUB_TOKEN provides authentication automatically
          gh release create "${TAG}" \
            "${ASSET_PATH}" \
            --title "Release ${TAG}" \
            --notes "${{ steps.changelog.outputs.changelog }}" \
            ${PRERELEASE_FLAG} \
            --repo "${{ github.repository }}"

          echo "::notice::Release ${TAG} created successfully!"
          echo "### Release Published" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`${TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Asset:** \`${ASSET}\`" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ github.server_url }}/${{ github.repository }}/releases/tag/${TAG}" >> $GITHUB_STEP_SUMMARY
